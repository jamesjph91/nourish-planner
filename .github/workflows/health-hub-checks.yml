name: Nourish app regression tests

on:
  push:
    paths:
      - 'index.html'
      - 'gym.js'
      - 'food-diary.js'
      - 'health-hub.js'
      - 'progress.js'
      - 'tests/**'
      - '.github/workflows/health-hub-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'gym.js'
      - 'food-diary.js'
      - 'health-hub.js'
      - 'progress.js'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check gym.js
          node --check food-diary.js
          node --check health-hub.js
          node --check progress.js
      - name: Regression tests
        run: node --test tests/*.test.cjs
