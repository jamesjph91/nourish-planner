name: FORGE app regression tests

on:
  push:
    paths:
      - 'index.html'
      - 'gym.js'
      - 'food-diary.js'
      - 'health-hub.js'
      - 'progress.js'
      - 'forge-original-theme.js'
      - 'forge-dashboard.js'
      - 'forge-master-ui.js'
      - 'forge-train.js'
      - 'forge-train-coach.js'
      - 'forge-v27-train.css'
      - 'forge-updater.js'
      - 'forge-food-navigation.js'
      - 'forge-meal-library-data.js'
      - 'forge-meal-library-plus.js'
      - 'forge-v32-smart.css'
      - 'forge-meal-cuisines.js'
      - 'forge-dietary.js'
      - 'forge-v33-dietary.css'
      - 'forge-meal-library.css'
      - 'forge-food-navigation.css'
      - 'forge-updater.css'
      - 'forge-build.json'
      - 'refresh-forge.html'
      - 'forge-fuel.js'
      - 'forge-activity.js'
      - 'forge-progress.js'
      - 'forge-fuel-insights.js'
      - 'forge-v26.css'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/health-hub-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'gym.js'
      - 'food-diary.js'
      - 'health-hub.js'
      - 'progress.js'
      - 'forge-original-theme.js'
      - 'forge-dashboard.js'
      - 'forge-master-ui.js'
      - 'forge-train.js'
      - 'forge-train-coach.js'
      - 'forge-v27-train.css'
      - 'forge-updater.js'
      - 'forge-food-navigation.js'
      - 'forge-meal-library-data.js'
      - 'forge-meal-library-plus.js'
      - 'forge-v32-smart.css'
      - 'forge-meal-cuisines.js'
      - 'forge-dietary.js'
      - 'forge-v33-dietary.css'
      - 'forge-meal-library.css'
      - 'forge-food-navigation.css'
      - 'forge-updater.css'
      - 'forge-build.json'
      - 'refresh-forge.html'
      - 'forge-fuel.js'
      - 'forge-activity.js'
      - 'forge-progress.js'
      - 'forge-fuel-insights.js'
      - 'forge-v26.css'
      - 'service-worker.js'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check gym.js
          node --check food-diary.js
          node --check health-hub.js
          node --check progress.js
          node --check forge-original-theme.js
          node --check forge-dashboard.js
          node --check forge-master-ui.js
          node --check forge-train.js
          node --check forge-train-coach.js
          node --check forge-updater.js
          node --check forge-food-navigation.js
          node --check forge-meal-library-data.js
          node --check forge-meal-library-plus.js
          node --check forge-meal-cuisines.js
          node --check forge-dietary.js
          node --check forge-fuel.js
          node --check forge-activity.js
          node --check forge-progress.js
          node --check forge-fuel-insights.js
          node --check service-worker.js
      - name: Regression tests
        run: node --test tests/*.test.cjs
