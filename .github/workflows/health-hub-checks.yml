name: FORGE app regression tests

on:
  push:
    paths:
      - 'index.html'
      - 'gym.js'
      - 'food-diary.js'
      - 'health-hub.js'
      - 'progress.js'
      - 'forge-original-theme.js'
      - 'forge-dashboard.js'
      - 'forge-today-v45.js'
      - 'forge-today-v45.css'
      - 'forge-master-ui.js'
      - 'forge-train.js'
      - 'forge-train-coach.js'
      - 'forge-strength-insights.js'
      - 'forge-strength-insights.css'
      - 'forge-v27-train.css'
      - 'forge-updater.js'
      - 'forge-food-navigation.js'
      - 'forge-meal-library-data.js'
      - 'forge-meal-library-plus.js'
      - 'forge-v32-smart.css'
      - 'forge-meal-cuisines.js'
      - 'forge-dietary.js'
      - 'forge-v33-dietary.css'
      - 'forge-coach.js'
      - 'forge-v34-coach.css'
      - 'forge-v35-week.css'
      - 'forge-reliability.js'
      - 'forge-v36-reliability.css'
      - 'forge-accounts.js'
      - 'forge-v37-accounts.css'
      - 'forge-visual-v40.css'
      - 'forge-visual-v47.css'
      - 'forge-art-hero.svg'
      - 'forge-art-train.svg'
      - 'forge-art-fuel.svg'
      - 'forge-art-activity.svg'
      - 'forge-art-progress.svg'
      - 'forge-fuel-v44.css'
      - 'forge-fuel-v46.css'
      - 'cloud-sync.js'
      - 'firestore.rules'
      - 'forge-meal-library.css'
      - 'forge-food-navigation.css'
      - 'forge-updater.css'
      - 'forge-build.json'
      - 'refresh-forge.html'
      - 'forge-fuel.js'
      - 'forge-activity.js'
      - 'forge-activity-explorer.js'
      - 'forge-activity-explorer.css'
      - 'forge-progress.js'
      - 'forge-fuel-insights.js'
      - 'forge-v26.css'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/health-hub-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'gym.js'
      - 'food-diary.js'
      - 'health-hub.js'
      - 'progress.js'
      - 'forge-original-theme.js'
      - 'forge-dashboard.js'
      - 'forge-today-v45.js'
      - 'forge-today-v45.css'
      - 'forge-master-ui.js'
      - 'forge-train.js'
      - 'forge-train-coach.js'
      - 'forge-strength-insights.js'
      - 'forge-strength-insights.css'
      - 'forge-v27-train.css'
      - 'forge-updater.js'
      - 'forge-food-navigation.js'
      - 'forge-meal-library-data.js'
      - 'forge-meal-library-plus.js'
      - 'forge-v32-smart.css'
      - 'forge-meal-cuisines.js'
      - 'forge-dietary.js'
      - 'forge-v33-dietary.css'
      - 'forge-coach.js'
      - 'forge-v34-coach.css'
      - 'forge-v35-week.css'
      - 'forge-reliability.js'
      - 'forge-v36-reliability.css'
      - 'forge-accounts.js'
      - 'forge-v37-accounts.css'
      - 'forge-visual-v40.css'
      - 'forge-visual-v47.css'
      - 'forge-art-hero.svg'
      - 'forge-art-train.svg'
      - 'forge-art-fuel.svg'
      - 'forge-art-activity.svg'
      - 'forge-art-progress.svg'
      - 'forge-fuel-v44.css'
      - 'forge-fuel-v46.css'
      - 'cloud-sync.js'
      - 'firestore.rules'
      - 'forge-meal-library.css'
      - 'forge-food-navigation.css'
      - 'forge-updater.css'
      - 'forge-build.json'
      - 'refresh-forge.html'
      - 'forge-fuel.js'
      - 'forge-activity.js'
      - 'forge-activity-explorer.js'
      - 'forge-activity-explorer.css'
      - 'forge-progress.js'
      - 'forge-fuel-insights.js'
      - 'forge-v26.css'
      - 'service-worker.js'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check gym.js
          node --check food-diary.js
          node --check health-hub.js
          node --check progress.js
          node --check forge-original-theme.js
          node --check forge-dashboard.js
          node --check forge-today-v45.js
          node --check forge-master-ui.js
          node --check forge-train.js
          node --check forge-train-coach.js
          node --check forge-strength-insights.js
          node --check forge-updater.js
          node --check forge-food-navigation.js
          node --check forge-meal-library-data.js
          node --check forge-meal-library-plus.js
          node --check forge-meal-cuisines.js
          node --check forge-dietary.js
          node --check forge-coach.js
          node --check forge-reliability.js
          node --check forge-accounts.js
          node --check forge-fuel.js
          node --check forge-activity.js
          node --check forge-activity-explorer.js
          node --check forge-progress.js
          node --check forge-fuel-insights.js
          node --check service-worker.js
      - name: Regression tests
        run: node --test tests/*.test.cjs
