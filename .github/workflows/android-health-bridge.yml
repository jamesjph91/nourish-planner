name: Nourish Android Health Bridge build

on:
  push:
    paths:
      - 'android-health-bridge/**'
      - '.github/workflows/android-health-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble prototype APK
        run: gradle -p android-health-bridge :app:assembleDebug --no-daemon
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: nourish-health-bridge-debug
          path: android-health-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
